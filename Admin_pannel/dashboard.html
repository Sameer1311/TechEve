<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="Task3.css">
</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Admin</h2>

        <ul>
            <li> <a class="text-decoration-none text-white" href="dashboard.html"> Dashboard</a></li>
            <li> <a class="text-decoration-none text-white" href="profile.html" >Profile </a></li>
            <li><a class="text-decoration-none text-white" href="settings.html"> Settings </a></li>

    <!-- Main Content -->

        <div class="header">
            <h1>Dashboard</h1>

        <div class="cards">

            </div>

            <div class="card">

            </div>

            <div class="card">
                <h3>Visitors</h3>
                <p>8,942</p>
            </div>

        </div>


        <!-- Table -->
        <div class="table-section">

            <h2>Recent Orders</h2>

            <table>
                <tr>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Status</th>
                    <th>Amount</th>
                </tr>

                <tr>
                    <td>101</td>
                    <td>John</td>
                    <td>Completed</td>
                    <td>$120</td>
                </tr>

                <tr>
                    <td>102</td>

                    <td>$80</td>
                </tr>

                <tr>
                    <td>103</td>

                    <td>Shipped</td>

                </tr>
