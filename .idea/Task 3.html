<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="Task3.css">
</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Admin</h2>

        <ul>
            <li>Dashboard</li>
            <li>Users</li>
            <li>Orders</li>
            <li>Products</li>
            <li>Analytics</li>
            <li>Settings</li>
        </ul>
    </div>


    <!-- Main Content -->
    <div class="main">

        <!-- Header -->
        <div class="header">
            <h1>Dashboard</h1>
            <input type="text" placeholder="Search...">
        </div>


        <!-- Cards -->
        <div class="cards">

            <div class="card">
                <h3>Total Users</h3>
                <p>1,245</p>
            </div>

            <div class="card">
                <h3>Orders</h3>
                <p>532</p>
            </div>

            <div class="card">
                <h3>Revenue</h3>
                <p>$12,430</p>
            </div>

            <div class="card">
                <h3>Visitors</h3>
                <p>8,942</p>
            </div>

        </div>


        <!-- Table -->
        <div class="table-section">

            <h2>Recent Orders</h2>

            <table>
                <tr>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Status</th>
                    <th>Amount</th>
                </tr>

                <tr>
                    <td>101</td>
                    <td>John</td>
                    <td>Completed</td>
                    <td>$120</td>
                </tr>

                <tr>
                    <td>102</td>
                    <td>Sarah</td>
                    <td>Pending</td>
                    <td>$80</td>
                </tr>

                <tr>
                    <td>103</td>
                    <td>Mike</td>
                    <td>Shipped</td>
                    <td>$210</td>
                </tr>

            </table>

        </div>

    </div>

</div>

</body>
</html>
